<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión | Vía Dorada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-logo">Vía Dorada</div>
        <form id="login-form">
            <div class="input-group">
                <label>Correo electrónico</label>
                <input type="email" id="email" required placeholder="ejemplo@correo.com">
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-primary">Entrar</button>
            <button type="button" class="btn-cancelar" onclick="window.location.href='index.html'">Cancelar / Regresar</button>
        </form>
        <div id="mensaje" class="mensaje"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
